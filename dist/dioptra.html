  <style>
/* Dioptra - Produktfamilien-Optik (wie Avina /ui). Dunkel ist Standard, hell per System oder Wahl. */
/* Aufbau: feste Kopfzeile mit Zurück, scrollender Inhalt, Tastenfeld oder Reiter unten. Alles für eine Hand. */
:root {
  --bg: #101018; --bg2: #16161f; --card: #1a1a26; --border: #2a2a3a; --hover: #22222f; --field: #12121c;
  --fg: #dcdce6; --muted: #9a9aaa; --accent: #5a38d6; --accent2: #9b84f5; --on-accent: #fff;
  --ok: #3ddc84; --warn: #f5b041; --danger: #ff6b5b; --danger-border: #6a2e2e; --overlay: rgba(0,0,0,.6);
  --r-eye: #9b84f5; --l-eye: #3ddc84; --key: #22222f; --key-strong: #2d2d3d;
  --radius: 10px; --radius-card: 12px; --tap: 48px;
  --font: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f7; --bg2: #ebebf1; --card: #ffffff; --border: #d6d6e0; --hover: #e9e9f1; --field: #ffffff;
    --fg: #1c1c28; --muted: #5b5b6e; --accent: #4b2bb8; --accent2: #4b2bb8; --on-accent: #fff;
    --ok: #1a7f3c; --warn: #8a5300; --danger: #c0392b; --danger-border: #e5b2ab; --overlay: rgba(20,20,40,.45);
    --r-eye: #4b2bb8; --l-eye: #1a7f3c; --key: #ffffff; --key-strong: #e4e4ec;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f3f7; --bg2: #ebebf1; --card: #ffffff; --border: #d6d6e0; --hover: #e9e9f1; --field: #ffffff;
  --fg: #1c1c28; --muted: #5b5b6e; --accent: #4b2bb8; --accent2: #4b2bb8; --on-accent: #fff;
  --ok: #1a7f3c; --warn: #8a5300; --danger: #c0392b; --danger-border: #e5b2ab; --overlay: rgba(20,20,40,.45);
  --r-eye: #4b2bb8; --l-eye: #1a7f3c; --key: #ffffff; --key-strong: #e4e4ec;
  color-scheme: light;
}

* { box-sizing: border-box; touch-action: manipulation; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font);
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: 20px; }
h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
p { margin: 0; }
a { color: var(--accent2); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--fg); -webkit-user-select: text; user-select: text; }
.res-value, .rx-val, .fld-val, .lens, .kv dd, .sum-total, pre { -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }

/* Rahmen */
.app { height: 100%; display: flex; flex-direction: column; }
.top {
  flex: none; background: var(--bg); border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.top-row { display: flex; align-items: center; gap: 6px; min-height: 52px; }
.top h1 { font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.top .brand { display: inline-flex; align-items: center; gap: 8px; }
.top .brand svg { width: 26px; height: 26px; }
.icon-btn { min-width: var(--tap); min-height: var(--tap); border: 0; background: transparent; border-radius: var(--radius); color: var(--accent2); font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; }
.icon-btn:active { background: var(--hover); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.placeholder { visibility: hidden; }
main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding-block: 12px 24px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
}
body.kp-open main { padding-bottom: 340px; }
.view { display: flex; flex-direction: column; gap: 12px; max-width: 720px; margin: 0 auto; }
@media (min-width: 900px) {
  .view { max-width: 1100px; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .view > .wide, .view > .list, .view > .tiles, .view > .search, .view > .chips { grid-column: 1 / -1; }
}
.tabs {
  flex: none; display: flex; border-top: 1px solid var(--border); background: var(--bg2);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
body.kp-open .tabs { display: none; }
.tab { flex: 1; min-height: 56px; background: none; border: 0; padding: 6px 4px 4px; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent2); }

/* Startseite */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 600px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tile { min-height: 92px; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.tile:active { background: var(--hover); }
.tile .tile-name { font-weight: 600; font-size: 16px; }
.tile .tile-sub { font-size: 12px; color: var(--muted); }
.tile svg { width: 26px; height: 26px; color: var(--accent2); }
.group-title { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.group-title h3 { flex: 1; }

/* Karten, Felder */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.result { border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rx { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field-col > span { font-weight: 600; font-size: 14px; }
.eye-R { color: var(--r-eye); } .eye-L { color: var(--l-eye); }
.fld { width: 100%; min-height: 58px; text-align: left; background: var(--field); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; }
.fld.active { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2) inset; }
.fld-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fld-row { display: flex; align-items: baseline; gap: 4px; }
.fld-val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 1.3em; }
.fld.empty .fld-val::before { content: "–"; color: var(--muted); font-weight: 400; }
.fld.active .fld-val::after { content: ""; display: inline-block; width: 2px; height: 1.1em; background: var(--accent2); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
.fld-unit { font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: 12px; color: var(--muted); }
select, input.text, textarea { width: 100%; min-height: var(--tap); background: var(--field); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; min-width: 0; font-size: 16px; }
textarea { min-height: 70px; resize: vertical; }

/* Tastenfeld */
#keypad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg2); border-top: 1px solid var(--border);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
.kp-head { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.kp-label { font-size: 13px; color: var(--muted); padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kp-value { flex: 1; text-align: right; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 8px; min-width: 0; overflow: hidden; }
.kp-close { min-height: 40px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.kp-quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.kp-quick::-webkit-scrollbar { display: none; }
.kp-chip { flex: none; min-height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--key); font-variant-numeric: tabular-nums; }
.kp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kp-key { min-height: 52px; border: 0; border-radius: var(--radius); background: var(--key); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kp-key:active { background: var(--accent); color: var(--on-accent); }
.kp-del, .kp-minus, .kp-plus, .kp-sign, .kp-comma { background: var(--key-strong); }
.kp-next { background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; }
@media (max-height: 600px) { .kp-key { min-height: 42px; font-size: 19px; } }

/* Ergebnisse */
.results { display: flex; flex-direction: column; gap: 6px; }
.res-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.res-row:last-child { border-bottom: 0; }
.res-label { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.res-value { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; white-space: nowrap; }
.res-extra { color: var(--muted); font-size: 13px; white-space: nowrap; }
.rx-box { background: var(--bg2); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rx-box > span:first-child { font-weight: 600; font-size: 14px; }
.rx-val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rx-sub { font-size: 13px; color: var(--muted); }
.big .rx-val { font-size: 22px; line-height: 1.25; }
.note { color: var(--muted); font-size: 13px; }
.warn { color: var(--warn); } .ok { color: var(--ok); } .danger { color: var(--danger); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr.mark td { color: var(--accent2); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.tabo { width: 100%; max-width: 420px; height: auto; margin: 0 auto; display: block; }
.tabo .ring { fill: none; stroke: var(--border); stroke-width: 1.5; }
.tabo .axis { stroke: var(--border); stroke-width: 1; }
.tabo text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.tabo .arrow-in { stroke: var(--accent2); stroke-width: 3; fill: var(--accent2); }

"use strict";

// Winkel: TABO-Schema, 0° rechts, 90° oben, gegen den Uhrzeigersinn, wie vom Betrachter (Augenoptiker) gesehen.
// Daraus folgt: rechtes Auge 0° = nasal (innen), linkes Auge 0° = temporal (außen).

  function prism(rP, rB, lP, lB) {

// ---- db.js
"use strict";
// Dioptra - Datenbanken: Gläser und Hörgeräte als Sammlungen im localStorage, mit Startbestand, Suche,
// Bearbeiten, JSON-Sicherung und CSV-Einlesen. Neue Startbestandseinträge kommen bei höherer Seed-Version dazu,
// bearbeitete Einträge bleiben erhalten.
class Collection {
  constructor(key, seed, seedVersion, types) { this.key = key; this.seed = seed; this.seedVersion = seedVersion; this.types = types; this.items = []; this.version = 0; }
  load() {
    let db = Store.get(this.key, null);
    if (!db || !Array.isArray(db.items)) db = { version: 0, items: [] };
    if (db.version < this.seedVersion) {
      const have = new Set(db.items.map(i => i.id));
      for (const s of this.seed) if (!have.has(s.id)) db.items.push(Object.assign({}, s));
      db.version = this.seedVersion; Store.set(this.key, db);
    }
    this.items = db.items; this.version = db.version; return this.items;
  }
  save() { Store.set(this.key, { version: this.version, items: this.items }); }
  byId(id) { return this.items.find(i => i.id === id); }
  // Eintrag mit gleichem Namen (und Hersteller, falls angegeben) finden, Groß- und Kleinschreibung egal.
  // Gleiche Namen kommen vor (KIND Premium als Einstärken- und Gleitsichtglas), darum zählt der Typ mit, wenn er angegeben ist.
  byName(name, hersteller, typ) {
    const low = x => String(x || "").trim().toLowerCase();
    const n = low(name), h = low(hersteller), t = low(typ);
    return this.items.find(i => low(i.name) === n && (!h || low(i.hersteller) === h) && (!t || low(i.typ) === t));
  }
  // Felder in die erwartete Form bringen: Eigenschaften als Liste, Preis als Zahl, Texte als Text.
  normalize(raw) {
    const it = Object.assign({}, raw);
    if (typeof it.eigenschaften === "string") it.eigenschaften = it.eigenschaften.split(/\||\n/).map(x => x.trim()).filter(Boolean);
    else if (!Array.isArray(it.eigenschaften)) it.eigenschaften = [];
    else it.eigenschaften = it.eigenschaften.map(x => String(x));
    if (typeof it.preis === "string") { const p = parseNum(it.preis.replace(/[€\s]/g, "")); if (!Number.isNaN(p)) it.preis = p; }
    for (const k of ["name", "hersteller", "typ", "stufe", "index", "bestellnr", "verfuegbar", "lieferbereich", "hinweis", "notizen", "bauform"]) if (it[k] != null && typeof it[k] !== "string") it[k] = String(it[k]);
    it.id = String(it.id || "");
    return it;
  }
  put(item) { const i = this.items.findIndex(x => x.id === item.id); if (i >= 0) this.items[i] = item; else this.items.push(item); }
  upsert(item) { this.put(this.normalize(item)); this.save(); }
  remove(id) { this.items = this.items.filter(i => i.id !== id); this.save(); }
  resetSeed() { this.items = this.seed.map(s => Object.assign({}, s)); this.version = this.seedVersion; this.save(); }
  isSeed(item) { return this.seed.some(s => s.id === item.id); }
  exportJson() { return JSON.stringify({ app: "Dioptra", sammlung: this.key, version: this.version, exported: new Date().toISOString(), items: this.items }, null, 2); }
  importJson(text) {
    const o = JSON.parse(text);
    if (o && typeof o === "object" && !Array.isArray(o) && o.sammlung && o.sammlung !== this.key) throw new Error("Diese Sicherung gehört zu einer anderen Sammlung.");
    const items = Array.isArray(o) ? o : o.items;
    if (!Array.isArray(items)) throw new Error("Keine Liste in der Datei.");
    let n = 0;
    for (const raw of items) {
      if (!raw || typeof raw !== "object" || !raw.name) continue;
      const ex = (raw.id && this.byId(String(raw.id))) || this.byName(raw.name, raw.hersteller, raw.typ);
      const base = ex || { id: "imp-" + Math.random().toString(36).slice(2, 10), hersteller: "", typ: this.types[this.types.length - 1], eigenschaften: [] };
      const it = this.normalize(Object.assign({}, base, raw, { id: ex ? ex.id : (raw.id ? String(raw.id) : base.id) }));
      this.put(it); n++;
    }
    this.save();
    return n;
  }
  // CSV mit Kopfzeile. Trenner ; oder , oder Tab. Spalten nach Namen: id, name, hersteller, typ, stufe, preis, index,
  // bestellnr, verfuegbar, lieferbereich, eigenschaften (mit | getrennt), hinweis, notizen, bauform.
  importCsv(text) {
    const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error("CSV ohne Datenzeilen.");
    const sep = [";", "\t", ","].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
    const split = l => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
    const head = split(lines[0]).map(h => h.toLowerCase().replace(/[^a-zäöü]/g, ""));
    let n = 0;
    for (const line of lines.slice(1)) {
      const cells = split(line); const o = {};
      head.forEach((h, i) => { if (cells[i] != null && cells[i] !== "") o[h] = cells[i]; });
      if (!o.name) continue;
      if (!o.id) { const ex = this.byName(o.name, o.hersteller, o.typ); o.id = ex ? ex.id : "csv-" + Math.random().toString(36).slice(2, 10); }
      const base = this.byId(o.id) || { hersteller: "", typ: this.types[0], eigenschaften: [] };
      this.put(this.normalize(Object.assign({}, base, o))); n++;
    }
    this.save();
    return n;
  }
}

  const p = typeof i.preis === "number" ? fmt(i.preis, 2) + " €" : String(i.preis);

// Generische Listenansicht für eine Sammlung. cfg: {col, title, route, sub(item), fields:[...], note, placeholder}
function collectionView(cfg) {
  const col = cfg.col;
  const view = {
    title: cfg.title,
    render(main) {
      col.load();
      const ui = Store.get(col.key + ".ui", { typ: "", q: "" });
      const q = el("input.text", { type: "search", placeholder: cfg.placeholder || "Suchen", "aria-label": "Suchen", autocomplete: "off" });
      q.value = ui.q || "";
      const addBtn = el("button.btn", { type: "button", text: "Neu", on: { click: () => view.edit(main, null) } });
      const chips = el("div.chips", { role: "tablist" });
      const list = el("div.list");
      function chip(label, val) {
        const c = el("button.chip", { type: "button", role: "tab", text: label, "aria-selected": String(ui.typ === val),
          on: { click: () => { ui.typ = val; Store.set(col.key + ".ui", ui); for (const x of chips.children) x.setAttribute("aria-selected", "false"); c.setAttribute("aria-selected", "true"); draw(); } } });
        return c;
      }
      chips.append(chip("Alle", ""), ...col.types.map(t => chip(t, t)));
      function matches(i, s) {
        if (ui.typ && i.typ !== ui.typ) return false;
        if (!s) return true;
        const hay = [i.name, i.hersteller, i.stufe, i.bestellnr, i.hinweis, i.notizen, i.index, i.bauform, (i.eigenschaften || []).join(" ")].join(" ").toLowerCase();
        return s.split(/\s+/).every(w => hay.includes(w));
      }
      function draw() {
        const s = q.value.trim().toLowerCase();
        list.replaceChildren();

function taboSvg(r) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 440 236"); svg.setAttribute("class", "tabo"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "TABO-Schema mit Prismenrichtungen");
  function n(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k of Object.keys(attrs)) e.setAttribute(k, attrs[k]); svg.append(e); return e; }
  const maxP = Math.max(r.in.r.p, r.in.l.p, r.split.r.p, r.split.l.p, 0.01);
  function lens(cx, cy, label) {
    n("circle", { cx, cy, r: 78, class: "ring" }); n("line", { x1: cx - 78, y1: cy, x2: cx + 78, y2: cy, class: "axis" }); n("line", { x1: cx, y1: cy - 78, x2: cx, y2: cy + 78, class: "axis" });
    const t = (x, y, s, anchor) => { const e = n("text", { x, y, "text-anchor": anchor || "middle" }); e.textContent = s; };
    t(cx + 83, cy + 4, "0°", "start"); t(cx, cy - 84, "90°"); t(cx - 83, cy + 4, "180°", "end"); t(cx, cy + 96, "270°"); t(cx - 55, cy - 62, label);
  }
  function arrow(cx, cy, p, base, cls) {
    if (p < 0.005) return;
    const len = 18 + 52 * (p / maxP), a = base * Math.PI / 180, x2 = cx + len * Math.cos(a), y2 = cy - len * Math.sin(a);
    n("line", { x1: cx, y1: cy, x2, y2, class: cls });
    const hx = Math.cos(a), hy = -Math.sin(a), s = 7;
    n("polygon", { points: `${x2},${y2} ${x2 - s * hx + s * 0.55 * hy},${y2 - s * hy - s * 0.55 * hx} ${x2 - s * hx - s * 0.55 * hy},${y2 - s * hy + s * 0.55 * hx}`, class: cls });
  }
  lens(104, 116, "R"); lens(336, 116, "L");
  arrow(104, 116, r.in.r.p, r.in.r.base, "arrow-in"); arrow(336, 116, r.in.l.p, r.in.l.base, "arrow-in");
  arrow(104, 116, r.split.r.p, r.split.r.base, "arrow-split"); arrow(336, 116, r.split.l.p, r.split.l.base, "arrow-split");
  return svg;
}

// Dioptra - Preisrechner: Grundglas, Optionen aus der Gläserdatenbank, Fassung, freie Positionen, Rabatt. Nichts wird

Views.preis = {
  title: "Preisrechner", group: "preis", sub: "Brille mit Ausstattung kalkulieren",
  render(main) {
    DB.glaeser.load();
    const st = Object.assign({ typ: "Gleitsicht", glas: null, optionen: [], posten: [] }, Store.get("dioptra.preis", {}));
    for (const k of Object.keys(st)) if (!["typ", "glas", "optionen", "posten"].includes(k)) delete st[k];
    const save = () => { Store.set("dioptra.preis", st); update(); };
    const out = el("div.results"); let text = "";
    const typen = ["Einstärken", "Gleitsicht", "Raumkomfort"];
    const glasList = el("div"), optList = el("div"), postenList = el("div");
    const items = () => DB.glaeser.items;
    const basis = () => items().filter(i => i.typ === st.typ);
    const optionen = () => items().filter(i => (i.typ === "Option" || i.typ === "Tönung") && i.id !== "kind-opt-prisma");
    const price = i => typeof i.preis === "number" ? i.preis : 0;
    // Grundglas immer aus dem aktuellen Typ; fehlt die gespeicherte Wahl, das erste Glas des Typs, sonst keins.
    const currentGlas = () => { const list = basis(); return list.find(i => i.id === st.glas) || list[0] || null; };

    function drawGlas() {
      glasList.replaceChildren();
      const list = basis(), cur = currentGlas();
      if (!list.length) { glasList.append(note("Keine Gläser dieses Typs in der Datenbank.")); return; }
      for (const i of list) glasList.append(el("button.opt", { type: "button", "aria-pressed": String(cur && cur.id === i.id), on: { click: () => { st.glas = i.id; save(); drawGlas(); } } },
        el("span.opt-box"), el("span.opt-text", el("span", { text: i.name }), el("span.opt-sub", { text: i.verfuegbar || "" })), el("span.opt-price", { text: fmtEur(price(i)) })));
    }
    function drawOpts() {
      optList.replaceChildren();
      for (const i of optionen()) {
        const on = st.optionen.includes(i.id);
        const blocked = !on && i.gruppe && (i.gruppe === "index" || i.gruppe === "toenung") && st.optionen.some(id => { const o = DB.glaeser.byId(id); return o && o.gruppe === i.gruppe; });

        } } }, el("span.opt-box"), el("span.opt-text", el("span", { text: i.name }), el("span.opt-sub", { text: (i.gruppe === "index" ? "Nur eine Glasstärke" : (i.gruppe === "toenung" ? "Nur eine Tönung" : (i.typ))) })), el("span.opt-price", { text: "+ " + fmtEur(price(i)) })));
      }
    }
    function drawPosten() {
      postenList.replaceChildren();
      st.posten.forEach((p, idx) => {
        const name = el("input.text", { type: "text", placeholder: "Bezeichnung", "aria-label": "Bezeichnung" }); name.value = p.name || "";
        const betrag = el("input.text", { type: "text", inputmode: "decimal", placeholder: "€", "aria-label": "Betrag" }); betrag.value = p.betrag == null ? "" : fmt(p.betrag, 2);
        name.addEventListener("input", () => { p.name = name.value; save(); });
        betrag.addEventListener("change", () => { const v = parseNum(betrag.value); p.betrag = Number.isNaN(v) ? null : v; betrag.value = p.betrag == null ? "" : fmt(p.betrag, 2); save(); });
        postenList.append(el("div.pos-row", name, betrag, el("button.icon-btn", { type: "button", "aria-label": "Position entfernen", text: "✕", on: { click: () => { st.posten.splice(idx, 1); save(); drawPosten(); } } })));
      });
    }
    const g = fieldGroup("dioptra.preis.felder", [
      { name: "prisma", label: "Gläser mit Prisma", unit: "Stück", step: 1, decimals: 0, min: 0, max: 2, initial: 0, quick: [0, 1, 2] },
      { name: "fassung", label: "Fassung", unit: "€", step: 10, decimals: 2, min: 0, max: 5000, quick: [0, 99, 149, 199, 249] },
      { name: "rabattProzent", label: "Rabatt", unit: "%", step: 5, decimals: 0, min: 0, max: 100, quick: [0, 10, 15, 20, 25] },
      { name: "rabattEuro", label: "Rabatt", unit: "€", step: 10, decimals: 2, min: 0, max: 5000 }], () => update());

    function calc() {
      const v = g.get(); const rows = []; let sum = 0;
      const glas = currentGlas();
      if (glas) { rows.push([glas.name + " (" + glas.typ + ", Paar)", price(glas)]); sum += price(glas); }
      for (const id of st.optionen) { const o = DB.glaeser.byId(id); if (o) { rows.push([o.name, price(o)]); sum += price(o); } }
      const pr = DB.glaeser.byId("kind-opt-prisma"); const n = num(v.prisma, 0);
      if (pr && n > 0) { const je = price(pr) / 2; rows.push(["Prisma, " + n + " Glas" + (n > 1 ? "er" : ""), je * n]); sum += je * n; }
      if (v.fassung != null && v.fassung > 0) { rows.push(["Fassung", v.fassung]); sum += v.fassung; }
      for (const p of st.posten) if (p.betrag != null) { rows.push([p.name || "Position", p.betrag]); sum += p.betrag; }

      section("Rabatt", el("div.grid2", g.node("rabattProzent"), g.node("rabattEuro"))),
      el("div.row.end.wide", el("button.btn.ghost.small", { type: "button", text: "Neue Kalkulation", on: { click: () => { st.optionen = []; st.posten = []; st.glas = null; save(); g.reset(); drawGlas(); drawOpts(); drawPosten(); } } })));
    drawGlas(); drawOpts(); drawPosten(); update();

const App = {
  main: null, title: null, back: null, action: null, tabs: null, current: null, copyFn: null, subBack: null,
  tabOf(view) { if (view === "glaeser") return "glaeser"; if (view === "preis") return "preis"; if (view === "mehr") return "mehr"; return "start"; },
  show(view, opts) {
    if (!Object.hasOwn(Views, view)) view = "start";
    Keypad.close(); Keypad.fields = [];
    this.current = view; this.copyFn = null; this.subBack = null;
    Store.set("dioptra.lastView", view);
    const tab = this.tabOf(view);
    for (const b of this.tabs.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    this.title.textContent = Views[view].title;
    this.back.classList.toggle("placeholder", tab !== "start" || view === "start");
    this.action.classList.add("placeholder"); this.action.textContent = ""; this.action.append(this.copyIcon.cloneNode(true)); this.action.setAttribute("aria-label", "Kopieren");
    this.main.replaceChildren();
    const wrap = el("div.view"); this.main.append(wrap);
    Views[view].render(wrap);
    this.main.scrollTop = 0;
  },
  // Unteransicht (Detail, Bearbeiten): eigener Titel, Zurück-Ziel, optionaler Aktionsknopf mit Text.
  sub(title, back, action) {
    Keypad.close(); Keypad.fields = [];
    this.title.textContent = title; this.subBack = back; this.back.classList.remove("placeholder");
    this.action.textContent = ""; this.copyFn = null;
    if (action) { this.action.textContent = action.label; this.action.setAttribute("aria-label", action.label); this.action.classList.remove("placeholder"); this.action.onclick = action.onClick; }
    else this.action.classList.add("placeholder");
    this.main.scrollTop = 0;
  },
  copy(fn) { this.copyFn = fn; this.action.classList.remove("placeholder"); this.action.onclick = () => { const t = fn(); if (t) copyText(t, "Ergebnis kopiert."); else toast("Noch kein Ergebnis.", "err"); }; },
  goBack() { if (this.subBack) { const b = this.subBack; this.subBack = null; b(); } else this.show("start"); },
  boot() {
    this.main = $("main"); this.title = $("title"); this.back = $("back"); this.action = $("action"); this.tabs = $("tabs");
    this.copyIcon = this.action.firstElementChild.cloneNode(true);
    Keypad.mount();
    this.back.addEventListener("click", () => this.goBack());
    for (const b of this.tabs.querySelectorAll(".tab")) b.addEventListener("click", () => this.show(b.dataset.tab));
    // Hash nur beim Start auswerten (Deep-Link), danach keine Historie mehr anfassen.
    const h = (location.hash || "").replace(/^#/, "");
    if (h) history.replaceState(null, "", location.pathname + location.search);
    const last = Store.get("dioptra.lastView", "start");
    this.show(Object.hasOwn(Views, h) ? h : (Object.hasOwn(Views, last) ? last : "start"));
    this.sw();
  },
  sw() {
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloaded || !hadController) return; reloaded = true; toast("Aktualisiert. Neue Version wird geladen."); setTimeout(() => location.reload(), 900); });
    navigator.serviceWorker.register("sw.js").catch(() => { /* ohne Offline-Cache weiter */ });
  }
};
document.addEventListener("DOMContentLoaded", () => App.boot());
