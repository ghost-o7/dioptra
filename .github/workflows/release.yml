# Release bauen: Windows (Setup .exe, .msi) und Linux (.deb, .AppImage) mit Tauri, Android (.apk) mit Capacitor.
# Ausgeloest durch einen Tag v<version> oder von Hand mit Angabe des Tags; der Tag entsteht dann beim Veroeffentlichen des Releases. Das Release entsteht als Entwurf, der Herausgeber prueft und
# veroeffentlicht es. Fuer stabile Android-Signaturen die Secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD und
# ANDROID_KEY_ALIAS anlegen (siehe docs/HANDBUCH.md); ohne sie wird je Lauf ein neuer Schluessel erzeugt.
name: Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag wie v0.2.0 (wird mit dem Release angelegt, falls er fehlt)
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux-Abhaengigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - name: Render-Pruefung
        run: node tools/check-refs.js
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Dioptra ${{ env.TAG }}"
          releaseBody: "Windows: Setup (.exe) oder .msi. Linux: .deb oder .AppImage. Android: .apk (Installation aus unbekannten Quellen erlauben). iPhone und iPad: Web-App unter https://ghost-o7.github.io/dioptra/"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
  android:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android-SDK pruefen (auf dem Runner vorinstalliert)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME"/build-tools | tail -3
      - run: npm ci
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android --iconBackgroundColor '#101018' --iconBackgroundColorDark '#101018' --splashBackgroundColor '#101018' --splashBackgroundColorDark '#101018'
      - name: Version eintragen
        run: |
          V=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: APK signieren
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            echo "Kein Keystore-Secret, erzeuge einen Schluessel nur fuer diesen Lauf."
            KS_PASS=dioptra-temporaer; KS_ALIAS=dioptra
            keytool -genkeypair -v -keystore release.keystore -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Dioptra, O=ghost-o7"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          V=$(node -p "require('./package.json').version")
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk dioptra-aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" --out "dioptra-$V-android.apk" dioptra-aligned.apk
          "$BT/apksigner" verify "dioptra-$V-android.apk"
          rm -f release.keystore dioptra-aligned.apk
          ls -la dioptra-*.apk
      - name: APK ans Release haengen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: dioptra-*-android.apk
